name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install RDKit (conda, for stable binary on all OS)
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          environment-file: environment.yml

      - name: Install package + test deps
        shell: bash -l {0}
        run: |
          pip install -e .
          pip install pytest

      - name: Run unit tests (library-only, no external PDB data required)
        shell: bash -l {0}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest tests/ \
            -q -p no:cacheprovider --import-mode=importlib \
            --ignore=tests/test_cyclization.py \
            --ignore=tests/test_branched.py \
            --ignore=tests/test_conformer_guard.py
      # NOTE: tests marked above are skipped in CI because they require the
      # gold-standard PDB set (TestFiles_Example/, ~850 MB, not in this repo).
      # Run them locally after fetching the data — see tests/README.md.
